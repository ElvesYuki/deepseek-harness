<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>DSH Launcher</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="mark">D</div><div><h1 id="appTitle">DSH Launcher</h1><p data-copy="subtitle"></p></div><button id="data" data-action="data" data-copy="data"></button></header>
<main><section class="hero"><div><h2 id="phase"></h2><p id="version"></p><p id="actualPort" aria-live="polite"></p></div><div class="actions"><button class="primary" data-action="open" data-copy="open"></button><button data-action="start" data-copy="start"></button><button data-action="restart" data-copy="restart"></button><button data-action="stop" data-copy="stop"></button></div></section>
<div id="notice" role="status" aria-live="polite"></div><button id="retry" data-action="retry" data-copy="retry" hidden></button>
<nav class="tabs" role="tablist" aria-labelledby="appTitle"><button id="tab-connection" role="tab" aria-selected="true" aria-controls="panel-connection" data-tab="connection" data-copy="connection"></button><button id="tab-updates" role="tab" aria-selected="false" aria-controls="panel-updates" tabindex="-1" data-tab="updates" data-copy="updates"></button><button id="tab-storage" role="tab" aria-selected="false" aria-controls="panel-storage" tabindex="-1" data-tab="storage" data-copy="storage"></button><button id="tab-diagnostics" role="tab" aria-selected="false" aria-controls="panel-diagnostics" tabindex="-1" data-tab="diagnostics" data-copy="diagnostics"></button></nav><section id="panel-connection" role="tabpanel" aria-labelledby="tab-connection"><h2 data-copy="proxyTitle"></h2><form id="settings"><label><span data-copy="proxy"></span><input id="proxy" placeholder="http://127.0.0.1:7890" autocomplete="off"></label><div class="checks"><label><input type="checkbox" id="proxyUpdates"><span data-copy="proxyUpdates"></span></label><label><input type="checkbox" id="proxyService"><span data-copy="proxyService"></span></label><label><input type="checkbox" id="proxyBrowser"><span data-copy="proxyBrowser"></span></label></div><label><span data-copy="port"></span><input type="number" id="port" min="1024" max="65535" required></label><p id="dirty" class="hint" role="status"></p><div class="actions"><button type="submit" data-copy="save"></button><button type="button" id="resetSettings" data-copy="resetSettings"></button><button type="button" data-action="testProxy" data-copy="testProxy"></button></div><p class="hint" data-copy="proxyHint"></p></form></section><section id="panel-updates" role="tabpanel" aria-labelledby="tab-updates" hidden><h2 data-copy="updates"></h2><p class="muted" data-copy="source"></p><p id="latest"></p><div class="actions"><button data-action="check" data-copy="check"></button><button data-action="prepare" data-copy="prepare"></button><button class="primary" data-action="activate" data-copy="activate"></button><button data-action="cancel" data-copy="cancel"></button></div><p class="hint" data-copy="updateHint"></p><details><summary data-copy="notes"></summary><pre id="notes"></pre><button data-action="release" data-copy="release"></button></details></section>
<section id="panel-storage" role="tabpanel" aria-labelledby="tab-storage" hidden class="data-import"><h2 data-copy="importTitle"></h2><p id="defaultData" class="hint"></p><div class="actions"><button data-action="importDefault" data-copy="importDefault"></button><button data-action="importDirectory" data-copy="importDirectory"></button><button data-action="discoverData" data-copy="discoverData"></button></div><p class="hint" data-copy="importHint"></p></section>
<section id="panel-diagnostics" role="tabpanel" aria-labelledby="tab-diagnostics" hidden class="logs"><div class="log-title"><h2 data-copy="logs"></h2><span class="muted" data-copy="logHint"></span></div><pre id="logs" tabindex="0"></pre></section></main><script type="module" src="renderer.mjs"></script></body></html>
